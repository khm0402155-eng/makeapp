name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu 26 마이그레이션 충돌을 방지하기 위해 안정적인 24.04 LTS 버전 사용
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
              echo "HAS_KEYSTORE=true"
            } >> "$GITHUB_ENV"
          else
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          chmod +x ./gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew :app:assembleRelease --stacktrace --no-daemon
          else
            echo "Keystore secret not found. Building Debug APK instead..."
            ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: gifforfree-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
